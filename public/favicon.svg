<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="ecosystem-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <!-- 4TM Deep Navy / Cobalt -->
      <stop offset="0%" stop-color="#1E40AF" />
      <!-- Study Indigo -->
      <stop offset="22%" stop-color="#6366F1" />
      <!-- Ebook Forest Teal -->
      <stop offset="42%" stop-color="#0D9488" />
      <!-- Apps Burnt Orange -->
      <stop offset="62%" stop-color="#B45309" />
      <!-- Games Ruby -->
      <stop offset="82%" stop-color="#BE123C" />
      <!-- Tools Slate -->
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  
  <!-- Outer multicolor ecosystem border ring -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="url(#ecosystem-border)" stroke="none" />
  
  <!-- Inner solid near-black / black core background -->
  <rect x="2.25" y="2.25" width="27.5" height="27.5" rx="5.75" fill="#090D16" />
  
  <!-- Solid white 4TM brand lettering with pristine optical balance -->
  <text 
    x="16" 
    y="20.5" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
    font-size="10.5" 
    font-weight="900" 
    text-anchor="middle" 
    letter-spacing="-0.04em"
  >4TM</text>
</svg>
