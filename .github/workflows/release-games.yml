name: Release Games

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-games:
    name: Release Latest Dev Games Build to Production
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository (4TM)
        uses: actions/checkout@v4

      - name: Set up Node.js / Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate GitHub Secrets Prerequisite
        run: |
          echo "Checking required repository secrets..."
          MISSING_SECRETS=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing required secret: CLOUDFLARE_API_TOKEN"
            MISSING_SECRETS=1
          fi
          if [ -z "${{ secrets.GH_PAT || secrets.REPO_ACCESS_TOKEN }}" ]; then
            echo "::error::Missing required secret: GH_PAT or REPO_ACCESS_TOKEN for cross-repository access to mantringuyen/4TM-games"
            MISSING_SECRETS=1
          fi
          if [ "$MISSING_SECRETS" -eq 1 ]; then
            echo "::error::Prerequisite check failed: Required GitHub secrets (CLOUDFLARE_API_TOKEN, GH_PAT/REPO_ACCESS_TOKEN) are not configured. Please configure these secrets in repository settings before triggering a release."
            exit 1
          fi
          echo "All required deployment secrets are present."

      - name: Fetch Specific Artifact from Latest Successful Dev Workflow Run
        env:
          TOKEN: ${{ secrets.GH_PAT || secrets.REPO_ACCESS_TOKEN }}
        run: |
          echo "==> Finding latest successful workflow run and 'block-puzzle-dev-build' artifact from mantringuyen/4TM-games..."
          API_BASE="https://api.github.com/repos/mantringuyen/4TM-games"

          RUNS_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "$API_BASE/actions/runs?status=success&per_page=10")
          RUN_IDS=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[].id')

          FOUND_ARTIFACT=0
          DOWNLOAD_URL=""

          for RUN_ID in $RUN_IDS; do
            echo "Checking successful run ID: $RUN_ID"
            ART_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "$API_BASE/actions/runs/$RUN_ID/artifacts")
            
            DOWNLOAD_URL=$(echo "$ART_JSON" | jq -r '.artifacts[] | select(.name == "block-puzzle-dev-build") | .archive_download_url')
            
            if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
              echo "Found target artifact 'block-puzzle-dev-build' in successful run $RUN_ID."
              FOUND_ARTIFACT=1
              break
            fi
          done

          if [ "$FOUND_ARTIFACT" -eq 0 ] || [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "::error::Could not find artifact 'block-puzzle-dev-build' from any recent successful workflow run in mantringuyen/4TM-games."
            exit 1
          fi

          echo "Downloading artifact from verified successful run..."
          curl -L -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "$DOWNLOAD_URL" -o dev-game-artifact.zip

          echo "Extracting Dev game build..."
          mkdir -p temp-dev-build
          unzip -q dev-game-artifact.zip -d temp-dev-build
          ls -la temp-dev-build

      - name: Verify Dev Build Integrity and Non-Empty Required Files
        run: |
          echo "==> Verifying completeness and non-empty size of required export files..."
          BUILD_DIR="temp-dev-build"
          if [ -d "temp-dev-build/dist" ]; then
            BUILD_DIR="temp-dev-build/dist"
          elif [ -d "temp-dev-build/public/games/block-puzzle" ]; then
            BUILD_DIR="temp-dev-build/public/games/block-puzzle"
          fi

          echo "Using build source directory: $BUILD_DIR"

          MISSING_OR_EMPTY=0

          check_file() {
            local filepath="$1"
            local desc="$2"
            if [ ! -f "$filepath" ]; then
              echo "::error::Required $desc missing at $filepath"
              MISSING_OR_EMPTY=1
            elif [ ! -s "$filepath" ]; then
              echo "::error::Required $desc is empty (0 bytes) at $filepath"
              MISSING_OR_EMPTY=1
            else
              echo "Verified non-empty $desc: $filepath ($(stat -c%s "$filepath" 2>/dev/null || stat -f%z "$filepath" 2>/dev/null) bytes)"
            fi
          }

          HTML_FILE=$(find "$BUILD_DIR" -name "index.html" | head -n 1)
          JS_FILE=$(find "$BUILD_DIR" -name "*.js" | head -n 1)
          PCK_FILE=$(find "$BUILD_DIR" -name "index.pck" | head -n 1)
          WASM_FILE=$(find "$BUILD_DIR" -name "*.wasm.gz" -o -name "*.wasm" | head -n 1)
          MANIFEST_FILE=$(find "$BUILD_DIR" -name "manifest.json" | head -n 1)

          check_file "$HTML_FILE" "index.html"
          check_file "$JS_FILE" "JavaScript bundle (*.js)"
          check_file "$WASM_FILE" "WebAssembly asset (*.wasm.gz or *.wasm)"
          check_file "$PCK_FILE" "Godot pack (index.pck)"

          if [ -n "$MANIFEST_FILE" ]; then
            check_file "$MANIFEST_FILE" "manifest.json"
          else
            echo "Note: manifest.json not found in export (optional/not required by current export)."
          fi

          if [ "$MISSING_OR_EMPTY" -eq 1 ]; then
            echo "::error::Validation failed: One or more required export files are missing or empty."
            exit 1
          fi

          echo "SUCCESS: All required export files verified non-empty."
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

      - name: Clean Staging and Transfer Verified Dev Build
        run: |
          echo "==> Cleaning staging directory and transferring verified Dev build..."
          SRC_DIR="${{ env.BUILD_DIR }}"
          TARGET_DIR="products/games/public/games/block-puzzle"

          mkdir -p "$TARGET_DIR"
          rm -rf "$TARGET_DIR"/*

          cp -r "$SRC_DIR"/* "$TARGET_DIR"/

          echo "Files successfully staged in $TARGET_DIR:"
          ls -la "$TARGET_DIR"

      - name: Build Production Games App
        run: |
          echo "==> Building and validating production games app before touching production R2/Workers..."
          bun run --prefix products/games build
          echo "SUCCESS: Production games build completed successfully."

      - name: Backup Existing Production PCK
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "==> Backing up existing production block-puzzle/index.pck from R2 before replacement..."
          npx wrangler r2 object get 4tm-games/block-puzzle/index.pck --file previous-index.pck --config products/games/wrangler.jsonc || echo "No existing index.pck found on production R2 (first release or fresh bucket)."

      - name: Upload PCK to Production R2 Bucket (4tm-games)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "==> Uploading index.pck to production R2 bucket '4tm-games' using canonical key 'block-puzzle/index.pck'..."
          PCK_PATH="products/games/public/games/block-puzzle/index.pck"
          if [ ! -f "$PCK_PATH" ] || [ ! -s "$PCK_PATH" ]; then
            echo "::error::Valid non-empty index.pck not found at $PCK_PATH"
            exit 1
          fi

          npx wrangler r2 object put 4tm-games/block-puzzle/index.pck --file "$PCK_PATH" --config products/games/wrangler.jsonc
          echo "SUCCESS: index.pck successfully uploaded to production R2 bucket 4tm-games."

      - name: Deploy Public Games Worker to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "==> Deploying Public Games Worker to Production (games.4tm.io.vn)..."
          cd products/games
          npx wrangler deploy --config wrangler.jsonc
          echo "SUCCESS: Public Games Worker deployed successfully to production."

      - name: Automatic Rollback on Failure
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "==> ERROR: Release pipeline failed. Checking for previous production PCK backup to restore..."
          if [ -f "previous-index.pck" ] && [ -s "previous-index.pck" ]; then
            echo "Found previous-index.pck backup ($(stat -c%s "previous-index.pck" 2>/dev/null || stat -f%z "previous-index.pck" 2>/dev/null) bytes). Attempting automatic rollback..."
            if npx wrangler r2 object put 4tm-games/block-puzzle/index.pck --file previous-index.pck --config products/games/wrangler.jsonc; then
              echo "::notice::Rollback SUCCESS: Previous index.pck restored successfully to production R2 bucket 4tm-games."
            else
              echo "::error::Rollback FAILED: Could not restore previous index.pck to production R2 bucket 4tm-games."
              exit 1
            fi
          else
            echo "::warning::No previous production PCK backup found (previous-index.pck missing or empty). Rollback skipped."
          fi
