<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Block Puzzle — 4TM</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #090d16;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<noscript>
			Your browser does not support JavaScript.
		</noscript>
		<div id="status">
			<img id="status-splash" src="index.png" alt="Block Puzzle — 4TM">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
		// 4TM Cross-Origin R2 & WASM Compression Handler
		(function () {
			const origFetch = window.fetch;
			window.fetch = async function (resource, init) {
				let url = typeof resource === 'string' ? resource : (resource && resource.url ? resource.url : '');

				// 1. Direct R2/CDN package delivery with proxy fallback:
				if (url.includes('games-data.4tm.io.vn') || url.includes('.pck')) {
					let res;
					try {
						// Attempt direct fetch first
						const directRes = await origFetch(resource, init);
						const directCt = directRes ? (directRes.headers.get('content-type') || '') : '';
						if (directRes && directRes.ok && !directCt.includes('text/html')) {
							res = directRes;
						}
					} catch (directErr) {
						console.warn('[4TM Games] Direct fetch failed, falling back to same-origin proxy:', directErr);
					}

					if (!res) {
						// Fallback to same-origin proxy backed by Cloudflare R2 binding
						try {
							const parsed = new URL(url, window.location.origin);
							// Map to canonical /games/block-puzzle/index.pck if not already
							let proxyPath = parsed.pathname;
							if (!proxyPath.includes('.pck')) {
								proxyPath = '/games/block-puzzle/index.pck';
							}
							const proxyRes = await (resource instanceof Request ? origFetch(new Request(proxyPath, resource)) : origFetch(proxyPath, init));
							const proxyCt = proxyRes ? (proxyRes.headers.get('content-type') || '') : '';
							if (proxyRes && proxyRes.ok && !proxyCt.includes('text/html')) {
								res = proxyRes;
							}
						} catch (proxyErr) {
							console.error('[4TM Games] Proxy mapping fallback failed:', proxyErr);
						}
					}

					if (res && res.ok) {
						const cl = res.headers.get('content-length');
						if (cl && typeof GODOT_CONFIG !== 'undefined' && GODOT_CONFIG.fileSizes) {
							const size = parseInt(cl, 10);
							if (size > 0) {
								GODOT_CONFIG.fileSizes[url] = size;
								GODOT_CONFIG.fileSizes["index.pck"] = size;
								GODOT_CONFIG.fileSizes["games/block-puzzle/index.pck"] = size;
								GODOT_CONFIG.fileSizes["/games/block-puzzle/index.pck"] = size;
							}
						}
						return res;
					}

					// Never return HTML fallback for a .pck file
					return new Response('Package file not found', {
						status: 404,
						headers: { 'Content-Type': 'text/plain' }
					});
				}

				// 2. WASM decompression & HTML fallback prevention
				if (url.endsWith('.wasm')) {
					let wasmRes;
					try {
						wasmRes = await origFetch(resource, init);
						let ct = wasmRes.headers.get('content-type') || '';
						if (!wasmRes.ok || ct.includes('text/html')) {
							wasmRes = null;
						}
					} catch (_) {
						wasmRes = null;
					}

					if (!wasmRes) {
						try {
							const gzUrl = url + '.gz';
							const gzRes = await origFetch(gzUrl, init);
							let gzType = gzRes.headers.get('content-type') || '';
							if (gzRes && gzRes.ok && !gzType.includes('text/html')) {
								wasmRes = gzRes;
							}
						} catch (gzErr) {
							console.error('[4TM Block Puzzle Loader v4] WASM gz fallback failed:', gzErr);
						}
					}

					// If both failed or returned HTML fallback, NEVER return HTML for a WASM request
					if (!wasmRes) {
						return new Response('WebAssembly asset not found', {
							status: 404,
							headers: { 'Content-Type': 'text/plain' }
						});
					}

					// Inspect bytes to decompress if gzipped and verify \0asm magic header
					try {
						const buf = await wasmRes.arrayBuffer();
						const bytes = new Uint8Array(buf);
						let wasmBuffer = buf;

						if (bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b) {
							if (typeof DecompressionStream !== 'undefined') {
								const ds = new DecompressionStream('gzip');
								const decompressedResponse = new Response(new Response(buf).body.pipeThrough(ds));
								wasmBuffer = await decompressedResponse.arrayBuffer();
							}
						}

						const verifyBytes = new Uint8Array(wasmBuffer);
						if (
							verifyBytes.length >= 4 &&
							verifyBytes[0] === 0x00 &&
							verifyBytes[1] === 0x61 &&
							verifyBytes[2] === 0x73 &&
							verifyBytes[3] === 0x6d
						) {
							return new Response(wasmBuffer, {
								status: 200,
								headers: { 'Content-Type': 'application/wasm' }
							});
						} else {
							console.error('[4TM Block Puzzle Loader v4] Invalid WASM magic bytes:', verifyBytes.slice(0, 4));
							return new Response('Invalid WebAssembly module header', {
								status: 500,
								headers: { 'Content-Type': 'text/plain' }
							});
						}
					} catch (parseErr) {
						console.error('[4TM Block Puzzle Loader v4] WASM parse error:', parseErr);
						return new Response('Error parsing WebAssembly asset', {
							status: 500,
							headers: { 'Content-Type': 'text/plain' }
						});
					}
				}

				return origFetch(resource, init);
			};
		})();
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {
	"mainPack": "index.pck",
	"args": [],
	"canvasResizePolicy": 2,
	"ensureCrossOriginIsolationHeaders": true,
	"executable": "index",
	"experimentalVK": false,
	"fileSizes": {
		"index.pck": 48215200,
		"block-puzzle/index.pck": 48215200,
		"games/block-puzzle/index.pck": 48215200,
		"/games/block-puzzle/index.pck": 48215200,
		"https://games-data.4tm.io.vn/block-puzzle/index.pck": 48215200,
		"https://games-data.4tm.io.vn/games/block-puzzle/index.pck": 48215200,
		"/api/games-data/block-puzzle/index.pck": 48215200,
		"/api/games-data/games/block-puzzle/index.pck": 48215200,
		"index.wasm": 35376909
	},
	"focusCanvas": true,
	"gdextensionLibs": []
};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			console.log('[4TM Block Puzzle Loader v4] Hiding loading overlay');
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error('[4TM Block Puzzle Loader v4] Failure notice:', err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('[4TM Block Puzzle Loader v4] Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		console.log('[4TM Block Puzzle Loader v4] Starting Godot 4.3 Web Engine...');
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			console.log('[4TM Block Puzzle Loader v4] Engine started successfully, entering game arena');
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
