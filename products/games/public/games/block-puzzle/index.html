<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Block Puzzle — 4TM</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #090d16;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<noscript>
			Your browser does not support JavaScript.
		</noscript>
		<div id="status">
			<img id="status-splash" src="index.png" alt="Block Puzzle — 4TM">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
		// 4TM Cross-Origin R2 & WASM Compression Handler
		(function () {
			const origFetch = window.fetch;
			window.fetch = async function (resource, init) {
				let url = typeof resource === 'string' ? resource : (resource && resource.url ? resource.url : '');

				// 1. Direct R2/CDN package delivery with proxy fallback:
				// Keep PCK downloads direct from R2/CDN (https://games-data.4tm.io.vn/block-puzzle/...) where possible
				if (url.includes('games-data.4tm.io.vn')) {
					try {
						// Attempt direct CDN download first
						const directRes = await origFetch(resource, init);
						if (directRes && directRes.ok) {
							return directRes;
						}
					} catch (directErr) {
						console.warn('[4TM Games] Direct CDN fetch failed, falling back to same-origin proxy:', directErr);
					}

					// Fallback to same-origin proxy backed by Cloudflare R2 binding
					try {
						const parsed = new URL(url, window.location.origin);
						// Normalize path: map /games/block-puzzle to /block-puzzle if needed
						const cleanPath = parsed.pathname.replace(/^\/games\//, '/');
						const proxyPath = '/api/games-data' + cleanPath;
						if (resource instanceof Request) {
							return origFetch(new Request(proxyPath, resource));
						}
						return origFetch(proxyPath, init);
					} catch (proxyErr) {
						console.error('[4TM Games] Proxy mapping fallback failed:', proxyErr);
					}
				}

				// 2. WASM decompression fallback (when .wasm is requested but only .wasm.gz is stored)
				if (url.endsWith('.wasm')) {
					try {
						const wasmRes = await origFetch(resource, init);
						const ct = wasmRes.headers.get('content-type') || '';
						if (wasmRes && wasmRes.ok && !ct.includes('text/html')) return wasmRes;
					} catch (_) {}

					try {
						const gzUrl = url + '.gz';
						const gzRes = await origFetch(gzUrl, init);
						const gzType = gzRes.headers.get('content-type') || '';
						if (gzRes && gzRes.ok && !gzType.includes('text/html')) {
							if (typeof DecompressionStream !== 'undefined') {
								const ds = new DecompressionStream('gzip');
								const decompressed = gzRes.body.pipeThrough(ds);
								return new Response(decompressed, {
									status: 200,
									headers: { 'Content-Type': 'application/wasm' }
								});
							}
							return gzRes;
						}
					} catch (gzErr) {
						console.error('[4TM Block Puzzle Loader v4] WASM gz fallback failed:', gzErr);
					}
				}

				return origFetch(resource, init);
			};
		})();
		</script>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {
	"mainPack": "https://games-data.4tm.io.vn/block-puzzle/index.pck",
	"args": [],
	"canvasResizePolicy": 2,
	"ensureCrossOriginIsolationHeaders": true,
	"executable": "index",
	"experimentalVK": false,
	"fileSizes": {
		"index.pck": 48215200,
		"https://games-data.4tm.io.vn/block-puzzle/index.pck": 48215200,
		"/api/games-data/block-puzzle/index.pck": 48215200,
		"https://games-data.4tm.io.vn/games/block-puzzle/index.pck": 48215200,
		"/api/games-data/games/block-puzzle/index.pck": 48215200,
		"index.wasm": 35376909
	},
	"focusCanvas": true,
	"gdextensionLibs": []
};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			console.log('[4TM Block Puzzle Loader v4] Hiding loading overlay');
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error('[4TM Block Puzzle Loader v4] Failure notice:', err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('[4TM Block Puzzle Loader v4] Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		console.log('[4TM Block Puzzle Loader v4] Starting Godot 4.3 Web Engine...');
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			console.log('[4TM Block Puzzle Loader v4] Engine started successfully, entering game arena');
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
