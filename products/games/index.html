    <script>
      (function() {
        try {
          var isBlockPuzzle = window.location.pathname.replace(/\/+$/, '') === '/block-puzzle' || window.location.hash.indexOf('block-puzzle') !== -1;
          var mode = localStorage.getItem('4tm_theme_preference') || localStorage.getItem('4tm_theme_mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;

          if (isBlockPuzzle) {
            root.setAttribute('data-game', 'block-puzzle');
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.content = '#000000';
            var appleMeta = document.getElementById('apple-status-bar-meta');
            if (appleMeta) appleMeta.content = 'black-translucent';

            var earlyStyle = document.createElement('style');
            earlyStyle.id = 'block-puzzle-boot-css';
            earlyStyle.textContent = 'html[data-game="block-puzzle"], html[data-game="block-puzzle"] body, html[data-game="block-puzzle"] #root { background-color: #000 !important; color-scheme: dark !important; }';
            document.head.appendChild(earlyStyle);
          } else {
            if (isDark) {
              root.classList.add('dark');
              root.classList.remove('light');
              root.setAttribute('data-theme', 'dark');
              root.style.colorScheme = 'dark';
              var appleMetaDark = document.getElementById('apple-status-bar-meta');
              if (appleMetaDark) appleMetaDark.content = 'black-translucent';
            } else {
              root.classList.add('light');
              root.classList.remove('dark');
              root.setAttribute('data-theme', 'light');
              root.style.colorScheme = 'light';
              var appleMetaLight = document.getElementById('apple-status-bar-meta');
              if (appleMetaLight) appleMetaLight.content = 'black-translucent';
            }
          }
        } catch(e) {}
      })();
    </script>
